	<!DOCTYPE html>
	<html lang="es">
	<head>
	    <meta charset="UTF-8">
	    <title>Boleta de Compra</title>
	    <style>
	        body {
	            font-family: Arial, sans-serif;
	            background: #f2f2f2;
	            padding: 30px;
	        }

	        .boleta {
	            width: 400px;
	            margin: auto;
	            background: white;
	            padding: 25px;
	            border-radius: 10px;
	            box-shadow: 0 0 10px #ccc;
	        }

	        h2 {
	            text-align: center;
	        }

	        .dato {
	            margin: 15px 0;
	            padding: 10px;
	            border-bottom: 1px solid #ddd;
	        }

	        strong {
	            color: #333;
	        }
	    </style>
	</head>

	<body>

	    <div class="boleta">
	        <h2>BOLETA DE COMPRA</h2>

	        <div class="dato">
	            <strong>Nombre del producto:</strong> Polo
	        </div>

	        <div class="dato">
	            <strong>Talla:</strong> M
	        </div>

	        <div class="dato">
	            <strong>Color:</strong> Negro
	        </div>

	        <div class="dato">
	            <strong>Cantidad:</strong> 2
	        </div>

	        <div class="dato">
	            <strong>Forma de pago:</strong> Yape
	        </div>
	    </div>

	</body>
	</html>
